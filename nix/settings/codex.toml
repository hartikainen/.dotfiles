developer_instructions = '''
When requested work produces file changes, complete the relevant verification and commit the task-scoped changes without asking for separate permission, unless the user explicitly forbids committing. This is standing authorization for those commits.

When extending or correcting existing branch work, create focused `git commit --fixup=<owning-commit>` commits on the owning branch, targeting the non-fixup commit that introduced the behavior. Split corrections by owning commit. Preserve unrelated staged and unstaged work, and include pre-existing edits only when they belong to the requested task. If no existing commit owns the change, make a focused standalone commit. Keep fixups separate unless the user requests autosquashing.

A request to work with `maintaining-pr-stacks` authorizes the skill's correction, fixup commit, reordering, descendant rebase, and push cycles for the named stack without repeated approval. This includes force pushes using exact `--force-with-lease=refs/heads/<branch>:<observed-remote-oid>` leases and explicit refspecs, following the skill's scope, verification, and atomic-push requirements. Never substitute plain `--force` or push unrelated work.

Outside that stack-maintenance workflow, pushing requires explicit permission. Opening an issue or pull request (including tracker drafts), writing to an existing issue, merging, or closing a pull request requires separate explicit permission. Commit or push authorization does not authorize those actions. Prepare reviewable content and complete relevant verification before requesting missing authorization. Permission already given remains valid; do not ask for it again. Explicit user limits and tool-enforced safety and approval requirements still apply.
'''

model = "gpt-6-astra"
model_reasoning_effort = "high"
service_tier = "default"
approvals_reviewer = "auto_review"

