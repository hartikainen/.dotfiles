# tmux settings
# http://www.openbsd.org/cgi-bin/man.cgi/OpenBSD-current/man1/tmux.1#x4f5054494f4e53

# ----------------------------------------------------------------------
# | General Settings                                                   |
# ----------------------------------------------------------------------

# Update tmux's local $SSH_TTY environment variable on re-attach. This solves
# the issue where OSC 52 fails with ssh + tmux + emacs due to stale $SSH_TTY.
# `DISPLAY` is already in tmux's default `update-environment` list, so we only
# need to append `SSH_TTY` here.
set -ag update-environment "SSH_TTY"

if-shell '[ $(echo "$(tmux -V | sed -En "s/^tmux[^0-9]*([.0-9]+).*/\1/p") >= 3.3" | bc) -eq 1 ]' \
    "set-option -g allow-passthrough on"

# Make window index start at 1
set -g base-index 1

# Make pane index start at 1
setw -g pane-base-index 1

# Remove delay when sending commands
# (default is 500 milliseconds)
set -sg escape-time 50

# Increase pane number display time (to 5s)
set -g display-panes-time 5000

# Increase the pane history limit
set -g history-limit 1048576  # 2**20

# Automatically renumber windows when killing one
set-option -g renumber-windows on

# ----------------------------------------------------------------------
# | Key Mappings                                                       |
# ----------------------------------------------------------------------

# Change the key combination for the PREFIX key to `ctrl-\`
set-option -g prefix "C-\\"
unbind-key C-b

# Make tmux send the PREFIX to an application running
# within tmux simply by pressing PREFIX key twice
bind "C-\\" send-prefix

# Emulate emacs' `recenter-top-bottom`
# bind-key -T copy-mode C-l send-keys -X scroll-middle
bind-key -T copy-mode C-l \
    if-shell -F '#{==:#{@rstate},1}' \
        'send-keys -X scroll-top ; set-option -p @rstate 2' \
        "if-shell -F '#{==:#{@rstate},2}' \
            'send-keys -X scroll-bottom ; set-option -p @rstate 0' \
            'send-keys -X scroll-middle ; set-option -p @rstate 1'"

# - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -

# Use emacs keybindings in copy mode
setw -g mode-keys emacs

# Forward clipboard writes (including OSC 52 from apps inside tmux, e.g. emacs)
# out to the surrounding terminal. Requires the outer terminal to support
# OSC 52: Ghostty, iTerm2, and others do while macOS Terminal.app does not. We
# use `on` rather than `external` so apps running *inside* tmux can also reach
# the system clipboard via OSC 52 passthrough (used together with
# `allow-passthrough on` above).
set-option -g set-clipboard on

# - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -

# [ PREFIX + - ] Split window horizontally starting from current directory
bind - split-window -v -c "#{pane_current_path}"

# [ PREFIX + | ] Split window vertically starting from current directory
bind | split-window -h -c "#{pane_current_path}"

# [ PREFIX + c ] New window starting from current directory
bind c new-window -c "#{pane_current_path}"

# - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -

# [ PREFIX + h/j/k/l ] Move from pane to pane
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# [ PREFIX + H/J/K/L ] Resize pane
bind -r H resize-pane -L 10
bind -r J resize-pane -D 10
bind -r K resize-pane -U 10
bind -r L resize-pane -R 10

# - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -

# [ PREFIX + r ] Reload tmux config
bind r source-file ~/.tmux.conf \; display "tmux configs reloaded"


# ----------------------------------------------------------------------
# | Status bar                                                         |
# ----------------------------------------------------------------------

# Notified when something happens in one of the other windows
setw -g monitor-activity on
set -g visual-activity on

# Periodically refresh the status bar
set -g status-interval 60

# Customize what is displayed
set -g status-justify left
set -g status-left-length 50
set -g status-left " #S / "
#                     └─ current session name
set -g status-right " #(whoami)@#(hostname) - %R "
#                     └─ current time

# - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -

# Default colors
set -g status-style bg=green

# Colors for window list
setw -g window-status-style fg=black,bg=green,dim

# Colors for active window
setw -g window-status-current-style fg=black,bg=yellow,dim

# ----------------------------------------------------------------------
# | Input / Events                                                     |
# ----------------------------------------------------------------------

# Forward modified/function keys (CSI u) from supporting terminals.
set -s extended-keys on
# set -as terminal-features "*:extkeys"
set -as terminal-features ",xterm-ghostty:extkeys"
# Let apps (vim, emacs, etc.) react to terminal focus in/out.
set -g focus-events on
# Explicitly set the format if the above doesn't catch it:
# set -s extended-keys-format csi-u

# ----------------------------------------------------------------------
# | Visual Styling                                                     |
# ----------------------------------------------------------------------

# Display things in 256 colors
set -g default-terminal "tmux-256color"
# Advertise 24-bit (true) color support for any 256-color terminal. Uses
# `terminal-features` with the standardized `RGB` capability, which is the
# recommended form since tmux 3.2 (replaces the older `Tc` flag).
set -as terminal-features ",*256col*:RGB"
set -as terminal-features ",xterm-ghostty:RGB"
# tmux 3.5+
if-shell '[ $(echo "$(tmux -V | sed -En "s/^tmux[^0-9]*([.0-9]+).*/\1/p") >= 3.5" | bc) -eq 1 ]' \
    "setw -g pane-scrollbars on"

# - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -

# Command Line
set -g message-style fg=black,bg=green,dim

# - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -

# Pane divider
set -g pane-active-border-style bg=default,fg=green
set -g pane-border-style bg=default,fg=colour244

