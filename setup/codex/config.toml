model = "gpt-6-astra"
model_reasoning_effort = "high"
service_tier = "default"
approvals_reviewer = "auto_review"

[features]
memories = true

[memories]
use_memories = true
generate_memories = true

[agents]
max_concurrent_threads_per_session = 4

[tui]
whimsy = false
alternate_screen = "never"

[mcp_servers.linear]
enabled = false
url = "https://mcp.linear.app/mcp"
auth = "oauth"
enabled_tools = [
    "get_attachment",
    "list_agent_skills",
    "get_agent_skill",
    "list_comments",
    "list_cycles",
    "get_document",
    "list_documents",
    "extract_images",
    "get_issue",
    "list_issues",
    "list_issue_statuses",
    "get_issue_status",
    "list_issue_labels",
    "list_projects",
    "get_project",
    "list_project_labels",
    "list_release_pipelines",
    "list_releases",
    "get_release",
    "list_release_notes",
    "get_release_note",
    "get_diff",
    "list_diffs",
    "get_diff_threads",
    "list_milestones",
    "get_milestone",
    "list_teams",
    "get_team",
    "list_templates",
    "get_template",
    "list_users",
    "get_user",
    "get_workspace",
    "search_documentation",
    "list_initiatives",
    "get_initiative",
    "list_initiative_labels",
    "get_status_updates",
]

[mcp_servers.notion]
enabled = false
url = "https://mcp.notion.com/mcp"
auth = "oauth"
enabled_tools = [
    "notion-search",
    "notion-fetch",
    "notion-download-attachment",
    "notion-search-skills",
    "notion-get-comments",
    "notion-get-async-task",
    "notion-get-teams",
    "notion-get-users",
    "notion-query-data-sources",
    "notion-query-multiple-data-sources",
    "notion-query-meeting-notes",
    "notion-list-private-pages",
    "notion-list-shared-pages",
    "notion-list-favorite-pages",
    "notion-list-recent-pages",
    "notion-search-agents",
    "notion-search-sessions",
    "notion-query-sessions",
    "notion-get-session-status",
    "notion-wait-session",
    "notion-list-session-events",
    "notion-read-session-event",
    "notion-show-advanced-analysis-next-steps",
    "notion-check-mcp-next-steps",
]
