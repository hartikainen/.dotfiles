name: nix
on:
  push:
    branches: [main, development]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        base: [ubuntu:26.04, debian:13]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
      - name: Check, activate, and recover in a disposable guest
        run: python3 bin/test --base '${{ matrix.base }}' --full --storage-path /var/lib/docker
  macos:
    runs-on: macos-26
    env:
      DOTFILES_TEST_GUEST: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
      - name: Install verified Nix
        run: bash bin/bootstrap
      - name: Build and check
        run: |
          . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
          nix --extra-experimental-features 'nix-command flakes' flake check --no-write-lock-file
          ./bin/dotfiles build --profile desktop --system --fixture
      - name: Activate home configuration in the disposable runner
        run: |
          . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
          bash tests/nix/integration.sh
          bash tests/nix/hosts.sh --full
      - name: Full packages and public Doom
        run: |
          . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
          bash tests/nix/full.sh
      - name: Activate macOS settings in the disposable runner
        run: |
          . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
          python3 tests/nix/macos-preferences.py seed
          ./bin/dotfiles apply --profile desktop --system --fixture --adopt
          python3 tests/nix/macos-preferences.py verify a
          ./bin/dotfiles apply --profile desktop --system --fixture
          python3 tests/nix/macos-preferences.py verify a
          test "$(defaults read com.apple.dock autohide)" = 1
          /Applications/Ghostty.app/Contents/MacOS/ghostty +validate-config
  linux-system:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64-linux
            bootstrap: ''
          - runner: ubuntu-24.04-arm
            arch: aarch64-linux
            bootstrap: --upgrade-from-previous
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
      - name: Install, reboot, update, and recover Ubuntu in QEMU
        run: python3 bin/test-vm --arch '${{ matrix.arch }}' ${{ matrix.bootstrap }} --storage-path /var/lib/docker
