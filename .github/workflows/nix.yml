name: nix
on:
  push:
    branches: [main, development]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        base: [ubuntu:24.04, debian:13]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
      - name: Build disposable guest
        run: docker build --build-arg BASE='${{ matrix.base }}' -f tests/nix/Dockerfile -t dotfiles-test .
      - name: Home activation and recovery
        run: docker run --rm dotfiles-test
      - name: Evaluate full profiles and run Nix checks
        run: |
          docker run --rm dotfiles-test bash -c '
            nix flake check --no-write-lock-file
            for system in x86_64-linux aarch64-linux aarch64-darwin; do
              for profile in headless desktop; do
                nix eval --raw ".#homeConfigurations.$system-$profile.activationPackage.drvPath"
              done
            done
            nix eval --raw .#darwinConfigurations.desktop.system.drvPath
          '
  macos:
    runs-on: macos-14
    env:
      DOTFILES_TEST_GUEST: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
      - name: Install verified Nix
        run: bash setup/platform/bootstrap.sh
      - name: Build and check
        run: |
          . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
          nix --extra-experimental-features 'nix-command flakes' flake check --no-write-lock-file
          ./bin/dotfiles build --profile desktop --system --fixture
      - name: Activate home configuration in the disposable runner
        run: |
          . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
          brew install d12frosted/emacs-plus/emacs-plus@31
          bash tests/nix/integration.sh
      - name: Activate macOS settings in the disposable runner
        run: |
          . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
          ./bin/dotfiles apply --profile desktop --system --fixture --adopt
          test "$(defaults read com.apple.dock autohide)" = 1
          brew install --cask ghostty
          /Applications/Ghostty.app/Contents/MacOS/ghostty +validate-config
  linux-desktop:
    runs-on: ubuntu-24.04
    env:
      DOTFILES_TEST_GUEST: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
      - name: Bootstrap disposable Linux VM
        run: bash setup/platform/bootstrap.sh
      - name: Activate desktop integration
        run: |
          . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
          dbus-run-session -- ./bin/dotfiles apply --profile desktop --system --fixture --adopt
          test -L /etc/tmpfiles.d/non-nixos-gpu.conf
