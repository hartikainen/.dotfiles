# Per-user config for `xdg-user-dirs-update`; overrides
# `/etc/xdg/user-dirs.conf`. Linux-only — macOS doesn't ship this tool.
#
# We disable the updater entirely so it never rewrites our tracked
# `user-dirs.dirs` symlink (which it would otherwise do whenever
# `~/.config/user-dirs.locale` doesn't match the system locale, or simply
# when the file is missing on a fresh login).
#
# Run `xdg-user-dirs-update --force` manually if you ever want to
# regenerate `user-dirs.dirs` from scratch.

enabled=False
