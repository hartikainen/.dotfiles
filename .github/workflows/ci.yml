name: ci

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false

      # Shellcheck doesn't understand zsh, so we skip `.zshenv` and
      # everything under `.config/zsh/`. The doom submodule is elisp.
      - name: shellcheck
        uses: ludeeus/action-shellcheck@2.0.0
        env:
          SHELLCHECK_OPTS: --severity=warning --external-sources
        with:
          ignore_paths: >-
            .config/zsh
            .config/doom
          ignore_names: >-
            .zshenv

      - name: install shfmt
        uses: mfinelli/setup-shfmt@v4

      # `shfmt -d` exits non-zero if any file needs reformatting. We use
      # `-i 4 -ci`, which matches the formatting applied by `shfmt -w`
      # in commit-time auto-format. Zsh and applescript files are
      # excluded. To resync after manual edits: run the same command
      # below with `-w` instead of `-d`.
      - name: shfmt
        run: |
          mapfile -d '' files < <(git ls-files -z \
            '*.sh' \
            '.bashrc' \
            ':!:.config/zsh/**' \
            ':!:.config/doom/**' \
            ':!:*.applescript')
          shfmt -d -i 4 -ci "${files[@]}"

      - name: install yq
        run: ./setup/install/ubuntu/yq.sh

      - name: codex config merge
        run: bash ./.github/scripts/check-codex-config.sh

      - name: controller safety and source inventory
        run: python3 -m unittest discover -s tests/nix -p 'test_*.py'

      # Agent rules and skills point at each other by path, in prose and in
      # `hooks.json`. A moved file leaves the pointers behind and the agent's
      # read fails silently, so nothing downstream reports it.
      - name: agent references resolve
        run: ./.github/scripts/check-agent-references.sh
